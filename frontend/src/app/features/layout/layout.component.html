<div [style.display]="'flex'">
  <aside
    [tuiNavigationAside]="expanded()"
  >
    <header>
      <button
        iconStart="@tui.home"
        type="button"
        [tuiAsideItem]="hint"
      >
        <ng-container [ngTemplateOutlet]="hint"/>
        <ng-template #hint>
          <span tuiFade>A very very long product name</span>
          <div
            appearance="accent"
            tuiBadge
          >
            Alpha
          </div>
        </ng-template>
      </button>
    </header>
    <button
      iconStart="@tui.search"
      tuiAsideItem
      type="button"
    >
      Search

      @if (expanded()) {
        <div
          appearance="accent"
          tuiBadge
        >
          12
        </div>
      }
    </button>
    <a
      iconStart="@tui.users"
      tuiAsideItem
      [routerLink]="routes.Navigation"
    >
      Groups
    </a>
    <tui-aside-group>
      <button
        iconStart="@tui.settings"
        tuiAsideItem
        tuiChevron
        type="button"
      >
        Settings
        <ng-template>
          <button
            tuiAsideItem
            type="button"
          >
            Account
          </button>
          <button
            tuiAsideItem
            type="button"
          >
            Notifications
          </button>
          <button
            tuiAsideItem
            type="button"
          >
            Privacy
          </button>
        </ng-template>
      </button>
    </tui-aside-group>
    <button
      iconStart="@tui.heart"
      tuiAsideItem
      type="button"
    >
      <span tuiFade>By default ellipsis is used but you can use fade too</span>
    </button>
    <hr/>
    <button
      iconStart="@tui.plus"
      tuiAsideItem
      type="button"
    >
      Add
    </button>
    <footer>
      <button
        iconStart="@tui.star"
        tuiAsideItem
        type="button"
      >
        Favorites
      </button>
      <button
        tuiAsideItem
        type="button"
        [iconStart]="expanded() ? '@tui.chevron-left' : '@tui.chevron-right'"
        (click)="handleToggle()"
      >
        {{ expanded() ? 'Collapse' : 'Expand' }}
      </button>
    </footer>
  </aside>
  <main tuiNavigationMain>
    <nav
      compact
      tuiSubheader
      [style.position]="'sticky'"
    >
      <tui-breadcrumbs [itemsLimit]="10">
        @for (item of breadcrumbs; track item) {
          @if ($last) {
            <strong
              *tuiItem
              tuiFade
            >
              {{ item }}
            </strong>
          }
          @if (!$last) {
            <button
              *tuiItem
              tuiLink
              type="button"
            >
              {{ item }}
            </button>
          }
        }
      </tui-breadcrumbs>
      <tui-tabs tuiFade>
        <button
          tuiTab
          type="button"
        >
          Default view
        </button>
        <button
          tuiTab
          type="button"
        >
          Details
        </button>
        <button
          tuiTab
          type="button"
        >
          Followers
        </button>
      </tui-tabs>
      <button
        appearance="secondary"
        tuiButton
        type="button"
      >
        Secondary
      </button>
      <button
        tuiButton
        type="button"
      >
        Primary
      </button>
    </nav>
  </main>
</div>
